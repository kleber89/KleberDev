spring.application.name=portfolio-backend

# Server configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Database configuration - PostgreSQL for production
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:portfoliodb}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

# H2 Console (for development only)
spring.h2.console.enabled=true

# JPA configuration
spring.jpa.database-platform=${JPA_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.root=INFO
logging.level.com.kleberdev.portfolio=DEBUG

# API Documentation
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/api-docs
